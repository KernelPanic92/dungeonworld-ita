name: Vercel Production Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches:
      - master
jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build Project Artifacts
        env:
          # Keystatic (see keystatic.config.ts): the /keystatic UI is a client
          # component — the browser bundle decides the storage kind, and
          # Turbopack inlines only NEXT_PUBLIC_* vars into it. makeRouteHandler
          # instead validates the full GitHub config when the API route module
          # loads during the build. The client id is public (it appears in
          # OAuth URLs); the other two are repo secrets and never reach the
          # client bundle.
          KEYSTATIC_GITHUB_CLIENT_ID: Iv23lixRFPlYIJ6WEVfO
          NEXT_PUBLIC_KEYSTATIC_GITHUB_CLIENT_ID: Iv23lixRFPlYIJ6WEVfO
          KEYSTATIC_GITHUB_CLIENT_SECRET: ${{ secrets.KEYSTATIC_GITHUB_CLIENT_SECRET }}
          KEYSTATIC_SECRET: ${{ secrets.KEYSTATIC_SECRET }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}