name: Vercel Production Deployment
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  push:
    branches:
      - master
jobs:
  Deploy-Production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build Project Artifacts
        env:
          # The Keystatic admin UI is bundled at build time and branches on the
          # storage kind: without this it would render in local mode even on
          # production. A GitHub App client id is public (it appears in OAuth
          # URLs); the client secret and KEYSTATIC_SECRET live only in the
          # Vercel runtime env.
          KEYSTATIC_GITHUB_CLIENT_ID: Iv23lixRFPlYIJ6WEVfO
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}